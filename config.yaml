llm:
  model: gemma4:e4b
  temperature: 0.0
  prompt_file: rag-chat.yaml   # rag-chat.yaml | rag-exaone.yaml

retriever:
  vectorstore_path: data/vectorstore  # 프로젝트 루트 기준 상대경로 또는 절대경로
  embedding_model: bge-m3
  vector_weight: 0.6
  keyword_weight: 0.4
  top_k: 4                   # 하위 호환용 유지 (미사용)
  parent_chunk_size: 1500    # LLM에 전달되는 부모 청크 크기
  parent_chunk_overlap: 200
  child_chunk_size: 300      # 임베딩/검색에 사용되는 자식 청크 크기
  child_chunk_overlap: 50
  candidate_k: 15            # 자식 청크 검색 후보 수 (재순위화 입력 풀)
  final_k: 5                 # LLM에 전달할 최종 부모 문서 수 (상한)
  rerank_threshold: 5.5      # 이 점수 미만 문서는 제외 (관련 문서만 동적 반환, 최소 1개 보장)
  use_reranker: true         # CrossEncoder 재순위화 사용 여부
  reranker_model: models/bge-reranker-v2-m3   # 로컬 경로(오프라인) 또는 허브 ID(BAAI/bge-reranker-v2-m3)
  reranker_device: auto      # auto | cuda | cpu (auto: GPU 있으면 GPU 사용)

